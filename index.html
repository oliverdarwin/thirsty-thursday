<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thirsty Thursday - Sydney Eastern Suburbs Pub Specials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a16;
  --bg-card: #101024;
  --bg-card-hover: #141438;
  --bg-filter: rgba(10, 10, 22, 0.94);
  --neon-green: #39ff14;
  --neon-pink: #ff2d95;
  --neon-cyan: #00f0ff;
  --neon-yellow: #ffe600;
  --neon-orange: #ff6600;
  --neon-purple: #b829ff;
  --neon-red: #ff4444;
  --neon-teal: #14ffb4;
  --text: #c8c8d8;
  --text-bright: #e8e8f4;
  --text-dim: #555568;
  --border: #1c1c36;
  --border-hover: #2a2a4a;
  --font-pixel: 'Press Start 2P', monospace;
  --font-body: 'IBM Plex Mono', monospace;
}

/* === LIGHT MODE === */
[data-theme="light"] {
  --bg: #F5F3F0;
  --bg-card: #ffffff;
  --bg-card-hover: #FAFAFA;
  --bg-filter: rgba(245, 243, 240, 0.94);
  --neon-green: #1B9E2D;
  --neon-pink: #D42B72;
  --neon-cyan: #0891B2;
  --neon-yellow: #B8860B;
  --neon-orange: #D4650B;
  --neon-purple: #8B2FC9;
  --neon-red: #CC3333;
  --neon-teal: #0D9E6E;
  --text: #2D2D2D;
  --text-bright: #1A1A1A;
  --text-dim: #888888;
  --border: #E0DEDA;
  --border-hover: #D0CCC6;
}
[data-theme="light"] body::after { display: none; }
[data-theme="light"] .header__title { text-shadow: none; --title-glow: var(--neon-cyan); }
[data-theme="light"] .card { box-shadow: none; }
[data-theme="light"] #pub-map { background: #eee; }
[data-theme="light"] .leaflet-control-zoom a { background: #fff !important; color: #333 !important; border-color: var(--border) !important; }
[data-theme="light"] .leaflet-popup-content-wrapper { background: #fff !important; border-color: var(--border) !important; box-shadow: 0 4px 16px rgba(0,0,0,0.1) !important; color: var(--text) !important; }
[data-theme="light"] .leaflet-popup-tip { background: #fff !important; }

html { scroll-behavior: smooth; font-size: 118%; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 6px);
  pointer-events: none;
  z-index: 9999;
}

/* === HEADER === */
.header {
  padding: 1.4rem 1rem 0.8rem;
  max-width: 1440px;
  margin: 0 auto;
}
.header__row {
  display: grid;
  grid-template-columns: 40px 1fr 40px;
  align-items: center;
  text-align: center;
}
.header__title {
  --title-glow: var(--neon-cyan);
  font-family: var(--font-pixel);
  font-size: clamp(1.1rem, 3.5vw, 1.8rem);
  color: var(--title-glow);
  text-shadow:
    0 0 7px var(--title-glow),
    0 0 20px var(--title-glow),
    0 0 40px var(--title-glow);
  letter-spacing: 0.04em;
}

/* Scrolling pixel banner */
@keyframes pixelScroll {
  from { background-position: 0 0; }
  to { background-position: -128px 0; }
}

.pixel-banner {
  height: 4px;
  background: repeating-linear-gradient(
    90deg,
    var(--neon-cyan) 0px, var(--neon-cyan) 12px,
    transparent 12px, transparent 16px,
    var(--neon-pink) 16px, var(--neon-pink) 28px,
    transparent 28px, transparent 32px,
    var(--neon-green) 32px, var(--neon-green) 44px,
    transparent 44px, transparent 48px,
    var(--neon-yellow) 48px, var(--neon-yellow) 60px,
    transparent 60px, transparent 64px,
    var(--neon-orange) 64px, var(--neon-orange) 76px,
    transparent 76px, transparent 80px,
    var(--neon-purple) 80px, var(--neon-purple) 92px,
    transparent 92px, transparent 96px,
    var(--neon-red) 96px, var(--neon-red) 108px,
    transparent 108px, transparent 112px,
    var(--neon-teal) 112px, var(--neon-teal) 124px,
    transparent 124px, transparent 128px
  );
  background-size: 128px 4px;
  animation: pixelScroll 4s linear infinite;
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
}

.theme-toggle {
  width: 34px; height: 34px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  justify-self: end;
}
.theme-toggle:hover { border-color: var(--neon-cyan); }
.theme-toggle__icon {
  color: var(--text-dim);
  filter: drop-shadow(0 0 2px currentColor);
  transition: color 0.15s, filter 0.15s;
  display: flex;
}
.theme-toggle:hover .theme-toggle__icon {
  color: var(--neon-cyan);
  filter: drop-shadow(0 0 4px var(--neon-cyan));
}
[data-theme="light"] .theme-toggle__icon { filter: none; }
[data-theme="light"] .theme-toggle:hover .theme-toggle__icon { filter: none; }

/* === FILTER BAR === */
.filter-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-filter);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1rem;
}
.filter-bar__inner { max-width: 1440px; margin: 0 auto; }
.filter-section { margin-bottom: 0.4rem; }
.filter-section:last-of-type { margin-bottom: 0; }

.filter-label {
  font-family: var(--font-pixel);
  font-size: 0.42rem;
  color: var(--text-bright);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 0.3rem;
}

.filter-toggles {
  display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle;
}
.filter-toggle {
  font-family: var(--font-body);
  font-size: 0.56rem; font-weight: 500;
  padding: 1px 7px;
  background: none;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.12s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.filter-toggle:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
.filter-toggle.active {
  background: var(--neon-cyan);
  color: #000;
  border-color: var(--neon-cyan);
}

.filter-buttons { display: flex; flex-wrap: wrap; gap: 5px; }

.filter-btn {
  font-family: var(--font-body);
  font-size: 0.7rem; font-weight: 500;
  padding: 5px 11px;
  background: var(--bg);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
.filter-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
.filter-btn.active.day-thu { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
/* Day active colours */
.filter-btn.active[data-day="Mon"] { background: var(--neon-pink); color: #000; border-color: var(--neon-pink); }
.filter-btn.active[data-day="Tue"] { background: var(--neon-orange); color: #000; border-color: var(--neon-orange); }
.filter-btn.active[data-day="Wed"] { background: var(--neon-yellow); color: #000; border-color: var(--neon-yellow); }
.filter-btn.active[data-day="Thu"] { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
.filter-btn.active[data-day="Fri"] { background: var(--neon-green); color: #000; border-color: var(--neon-green); }
.filter-btn.active[data-day="Sat"] { background: var(--neon-purple); color: #fff; border-color: var(--neon-purple); }
.filter-btn.active[data-day="Sun"] { background: var(--neon-teal); color: #000; border-color: var(--neon-teal); }

/* Type active -- each gets its neon colour */
.filter-btn.active[data-type="steak"] { background: #ff4444; color: #000; border-color: #ff4444; }
.filter-btn.active[data-type="schnitty"] { background: #39ff14; color: #000; border-color: #39ff14; }
.filter-btn.active[data-type="parmi"] { background: #2de86a; color: #000; border-color: #2de86a; }
.filter-btn.active[data-type="burger"] { background: #ff6600; color: #000; border-color: #ff6600; }
.filter-btn.active[data-type="pizza"] { background: #ff2d95; color: #000; border-color: #ff2d95; }
.filter-btn.active[data-type="pasta"] { background: #b829ff; color: #fff; border-color: #b829ff; }
.filter-btn.active[data-type="seafood"] { background: #00f0ff; color: #000; border-color: #00f0ff; }
.filter-btn.active[data-type="wings"] { background: #ffe600; color: #000; border-color: #ffe600; }
.filter-btn.active[data-type="other"] { background: #14ffb4; color: #000; border-color: #14ffb4; }

/* Suburb active colours */
.filter-btn.active[data-suburb="Darlinghurst"] { background: var(--neon-pink); color: #000; border-color: var(--neon-pink); }
.filter-btn.active[data-suburb="Paddington"] { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
.filter-btn.active[data-suburb="Woollahra"] { background: var(--neon-purple); color: #fff; border-color: var(--neon-purple); }
.filter-btn.active[data-suburb="Redfern"] { background: var(--neon-orange); color: #000; border-color: var(--neon-orange); }
.filter-btn.active[data-suburb="Surry Hills"] { background: var(--neon-green); color: #000; border-color: var(--neon-green); }
.filter-btn.active[data-suburb="Woolloomooloo"] { background: var(--neon-teal); color: #000; border-color: var(--neon-teal); }
.filter-btn.active[data-suburb="Bondi Junction"] { background: var(--neon-yellow); color: #000; border-color: var(--neon-yellow); }
.filter-btn.active[data-suburb="Bondi Beach"] { background: var(--neon-red); color: #fff; border-color: var(--neon-red); }

/* === COUNTER BAR (inside sticky filter bar) === */
.counter-bar {
  max-width: 1440px; margin: 0 auto;
  padding: 0.5rem 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.counter {
  font-family: var(--font-body);
  font-size: 0.72rem; font-weight: 600;
  color: var(--neon-green);
  text-shadow: 0 0 8px rgba(57, 255, 20, 0.2);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.counter span { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.2); }

.controls { display: flex; gap: 8px; align-items: center; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.view-btn {
  font-family: var(--font-body); font-size: 0.68rem; font-weight: 500;
  padding: 4px 12px; background: var(--bg); color: var(--text-dim);
  border: none; cursor: pointer; transition: all 0.12s; text-transform: uppercase;
}
.view-btn + .view-btn { border-left: 1px solid var(--border); }
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--text-bright); color: var(--bg); }

.sort-select {
  font-family: var(--font-body); font-size: 0.68rem; font-weight: 500;
  background: var(--bg); color: var(--text-dim);
  border: 1px solid var(--border); padding: 4px 8px;
  border-radius: 2px; cursor: pointer; text-transform: uppercase;
}
.sort-select:focus { outline: 1px solid var(--neon-cyan); }

/* === CARD GRID === */
.grid-container { max-width: 1440px; margin: 0 auto; padding: 0.5rem 1rem 2rem; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* === VENUE CARD === */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 3px;
  padding: 1rem 1.1rem;
  position: relative;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  animation: cardIn 0.2s ease backwards;
  cursor: pointer;
}

.card[data-suburb="Darlinghurst"] { border-color: var(--neon-pink); box-shadow: 0 0 8px rgba(255,45,149,0.3), inset 0 0 8px rgba(255,45,149,0.06); }
.card[data-suburb="Paddington"] { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0,240,255,0.3), inset 0 0 8px rgba(0,240,255,0.06); }
.card[data-suburb="Woollahra"] { border-color: var(--neon-purple); box-shadow: 0 0 8px rgba(184,41,255,0.3), inset 0 0 8px rgba(184,41,255,0.06); }
.card[data-suburb="Redfern"] { border-color: var(--neon-orange); box-shadow: 0 0 8px rgba(255,102,0,0.3), inset 0 0 8px rgba(255,102,0,0.06); }
.card[data-suburb="Surry Hills"] { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(57,255,20,0.3), inset 0 0 8px rgba(57,255,20,0.06); }
.card[data-suburb="Woolloomooloo"] { border-color: var(--neon-teal); box-shadow: 0 0 8px rgba(20,255,180,0.3), inset 0 0 8px rgba(20,255,180,0.06); }
.card[data-suburb="Bondi Junction"] { border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255,230,0,0.3), inset 0 0 8px rgba(255,230,0,0.06); }
.card[data-suburb="Bondi Beach"] { border-color: var(--neon-red); box-shadow: 0 0 8px rgba(255,68,68,0.3), inset 0 0 8px rgba(255,68,68,0.06); }

.card:hover { background: var(--bg-card-hover); }
.card[data-suburb="Darlinghurst"]:hover { box-shadow: 0 0 14px rgba(255,45,149,0.5), 0 0 30px rgba(255,45,149,0.15), inset 0 0 12px rgba(255,45,149,0.08); }
.card[data-suburb="Paddington"]:hover { box-shadow: 0 0 14px rgba(0,240,255,0.5), 0 0 30px rgba(0,240,255,0.15), inset 0 0 12px rgba(0,240,255,0.08); }
.card[data-suburb="Woollahra"]:hover { box-shadow: 0 0 14px rgba(184,41,255,0.5), 0 0 30px rgba(184,41,255,0.15), inset 0 0 12px rgba(184,41,255,0.08); }
.card[data-suburb="Redfern"]:hover { box-shadow: 0 0 14px rgba(255,102,0,0.5), 0 0 30px rgba(255,102,0,0.15), inset 0 0 12px rgba(255,102,0,0.08); }
.card[data-suburb="Surry Hills"]:hover { box-shadow: 0 0 14px rgba(57,255,20,0.5), 0 0 30px rgba(57,255,20,0.15), inset 0 0 12px rgba(57,255,20,0.08); }
.card[data-suburb="Woolloomooloo"]:hover { box-shadow: 0 0 14px rgba(20,255,180,0.5), 0 0 30px rgba(20,255,180,0.15), inset 0 0 12px rgba(20,255,180,0.08); }
.card[data-suburb="Bondi Junction"]:hover { box-shadow: 0 0 14px rgba(255,230,0,0.5), 0 0 30px rgba(255,230,0,0.15), inset 0 0 12px rgba(255,230,0,0.08); }
.card[data-suburb="Bondi Beach"]:hover { box-shadow: 0 0 14px rgba(255,68,68,0.5), 0 0 30px rgba(255,68,68,0.15), inset 0 0 12px rgba(255,68,68,0.08); }

.card__top-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 0.5rem; gap: 8px;
}

.card__suburb-badge {
  font-family: var(--font-body); font-size: 0.62rem; font-weight: 600;
  padding: 2px 8px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
}
.card__suburb-badge[data-suburb="Darlinghurst"] { color: var(--neon-pink); background: rgba(255,45,149,0.08); }
.card__suburb-badge[data-suburb="Paddington"] { color: var(--neon-cyan); background: rgba(0,240,255,0.08); }
.card__suburb-badge[data-suburb="Woollahra"] { color: var(--neon-purple); background: rgba(184,41,255,0.08); }
.card__suburb-badge[data-suburb="Redfern"] { color: var(--neon-orange); background: rgba(255,102,0,0.08); }
.card__suburb-badge[data-suburb="Surry Hills"] { color: var(--neon-green); background: rgba(57,255,20,0.08); }
.card__suburb-badge[data-suburb="Woolloomooloo"] { color: var(--neon-teal); background: rgba(20,255,180,0.08); }
.card__suburb-badge[data-suburb="Bondi Junction"] { color: var(--neon-yellow); background: rgba(255,230,0,0.08); }
.card__suburb-badge[data-suburb="Bondi Beach"] { color: var(--neon-red); background: rgba(255,68,68,0.08); }

.card__day-badge {
  font-family: var(--font-body); font-size: 0.62rem; font-weight: 600;
  padding: 2px 8px; border-radius: 2px;
  white-space: nowrap; text-transform: uppercase;
  color: var(--text-dim); background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
}
.card__day-badge[data-day="Mon"] { color: var(--neon-pink); background: rgba(255,45,149,0.06); border-color: rgba(255,45,149,0.15); text-shadow: 0 0 6px rgba(255,45,149,0.3); }
.card__day-badge[data-day="Tue"] { color: var(--neon-orange); background: rgba(255,102,0,0.06); border-color: rgba(255,102,0,0.15); text-shadow: 0 0 6px rgba(255,102,0,0.3); }
.card__day-badge[data-day="Wed"] { color: var(--neon-yellow); background: rgba(255,230,0,0.06); border-color: rgba(255,230,0,0.15); text-shadow: 0 0 6px rgba(255,230,0,0.3); }
.card__day-badge[data-day="Thu"] { color: var(--neon-cyan); background: rgba(0,240,255,0.06); border-color: rgba(0,240,255,0.15); text-shadow: 0 0 6px rgba(0,240,255,0.3); }
.card__day-badge[data-day="Fri"] { color: var(--neon-green); background: rgba(57,255,20,0.06); border-color: rgba(57,255,20,0.15); text-shadow: 0 0 6px rgba(57,255,20,0.3); }
.card__day-badge[data-day="Sat"] { color: var(--neon-purple); background: rgba(184,41,255,0.06); border-color: rgba(184,41,255,0.15); text-shadow: 0 0 6px rgba(184,41,255,0.3); }
.card__day-badge[data-day="Sun"] { color: var(--neon-teal); background: rgba(20,255,180,0.06); border-color: rgba(20,255,180,0.15); text-shadow: 0 0 6px rgba(20,255,180,0.3); }

.card__pub-name {
  font-family: var(--font-body); font-size: 0.95rem; font-weight: 600;
  color: var(--text-bright); margin-bottom: 0.6rem; line-height: 1.35;
}

.card__specials {
  display: flex; flex-wrap: wrap; gap: 6px;
}

.card__special {
  font-family: var(--font-body); font-size: 0.78rem; font-weight: 500;
  padding: 4px 10px; border-radius: 2px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text);
}
.card__special strong {
  color: var(--neon-green);
  font-weight: 600;
  text-shadow: 0 0 6px rgba(57, 255, 20, 0.2);
}

/* === COMING SOON === */
.coming-soon {
  text-align: center; padding: 4rem 1rem; grid-column: 1 / -1;
}
.coming-soon__badge {
  display: inline-block;
  font-family: var(--font-pixel); font-size: 0.5rem;
  color: var(--neon-yellow);
  border: 1px solid rgba(255,230,0,0.2);
  background: rgba(255,230,0,0.05);
  padding: 4px 12px; border-radius: 2px;
  margin-bottom: 0.8rem;
  letter-spacing: 0.08em;
}
.coming-soon__text {
  font-family: var(--font-body); font-size: 0.85rem;
  color: var(--text-dim);
}

/* === MAP === */
.map-container {
  max-width: 1440px; margin: 0 auto;
  padding: 0.5rem 1rem 2rem; display: none;
  position: relative; z-index: 1;
}
.map-container.visible { display: block; }
#pub-map {
  width: 100%; height: 65vh; min-height: 400px;
  border-radius: 3px; border: 1px solid var(--border); background: #0e0e1e;
  position: relative;
}
.leaflet-control-zoom { border: 1px solid var(--border) !important; border-radius: 2px !important; overflow: hidden; }
.leaflet-control-zoom a {
  background: var(--bg-card) !important; color: var(--neon-cyan) !important;
  border-color: var(--border) !important; font-family: var(--font-body) !important;
  font-size: 15px !important; line-height: 26px !important; width: 28px !important; height: 28px !important;
}
.leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
.leaflet-control-attribution { display: none !important; }

/* Hide default popups -- using custom bottom card instead */
.leaflet-popup { display: none !important; }

/* Marker hover */
.custom-marker { background: none !important; border: none !important; }
.marker-pill { transition: transform 0.15s ease, box-shadow 0.15s ease; }
.marker-pill:hover { transform: scale(1.1); }

/* Bottom card overlay */
.map-card {
  position: absolute;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 3px;

}
.ee-winner-confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 10px;
  z-index: 10002;
  pointer-events: none;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header__row">
    <div></div>
    <div>
      <h1 class="header__title">THIRSTY THURSDAY</h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
      <span class="theme-toggle__icon" id="theme-icon"></span>
    </button>
  </div>
</div>

<div class="pixel-banner"></div>

<div class="filter-bar">
  <div class="filter-bar__inner">
    <div class="filter-section">
      <div class="filter-label">Day
        <span class="filter-toggles">
          <button class="filter-toggle active" data-action="all" data-filter="day">all</button>
          <button class="filter-toggle" data-action="none" data-filter="day">none</button>
        </span>
      </div>
      <div class="filter-buttons" id="day-filters"></div>
    </div>
    <div class="filter-section">
      <div class="filter-label">Suburb
        <span class="filter-toggles">
          <button class="filter-toggle active" data-action="all" data-filter="suburb">all</button>
          <button class="filter-toggle" data-action="none" data-filter="suburb">none</button>
        </span>
      </div>
      <div class="filter-buttons" id="suburb-filters"></div>
    </div>
    <div class="filter-section">
      <div class="filter-label">Type
        <span class="filter-toggles">
          <button class="filter-toggle active" data-action="all" data-filter="type">all</button>
          <button class="filter-toggle" data-action="none" data-filter="type">none</button>
        </span>
      </div>
      <div class="filter-buttons" id="type-filters"></div>
    </div>
    <div class="counter-bar">
      <div class="counter">Showing <span id="count-shown">0</span> / <span id="count-total">0</span> venues</div>
      <div class="controls">
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid">Grid</button>
          <button class="view-btn" data-view="map">Map</button>
        </div>
        <select class="sort-select" id="sort-select">
          <option value="price">Sort: Price</option>
          <option value="suburb">Sort: Suburb</option>
          <option value="name">Sort: Name</option>
        </select>
        <button class="pick-btn" id="pick-btn">Pick for me</button>
      </div>
    </div>
  </div>
</div>

<div class="grid-container">
  <div class="card-grid" id="card-grid"></div>
</div>

<div class="map-container" id="map-container">
  <div id="pub-map"></div>
</div>

<footer class="footer">
  <p class="footer__text">Last updated April 2026.</p>
</footer>

<script>
// ============================================================
// VENUE DATA (from thursday-specials.jsx)
// ============================================================
const VENUES = [
  { id: 1, name: "East Village Hotel", suburb: "Darlinghurst", lat: -33.8776, lng: 151.2166, specials: [{ item: "Wings", price: 1, type: "wings" }, { item: "Rump Steak", price: 20, type: "steak" }, { item: "Schnitty", price: 15, type: "schnitty" }, { item: "Parmi", price: 21, type: "parmi" }] },
  { id: 2, name: "Imperial Hotel", suburb: "Paddington", lat: -33.8849, lng: 151.2272, specials: [{ item: "Schnitty", price: 15, type: "schnitty" }] },
  { id: 3, name: "Bar Cleveland", suburb: "Redfern", lat: -33.8919, lng: 151.2141, specials: [{ item: "Schnitty", price: 17, type: "schnitty" }] },
  { id: 4, name: "Lord Dudley", suburb: "Woollahra", lat: -33.8848, lng: 151.2374, specials: [{ item: "Pot Pie", price: 18, type: "other" }] },
  { id: 5, name: "Light Brigade", suburb: "Woollahra", lat: -33.8885, lng: 151.2322, specials: [{ item: "Pizza", price: 18, type: "pizza" }] },
  { id: 6, name: "Lord Roberts", suburb: "Darlinghurst", lat: -33.8756, lng: 151.2152, specials: [{ item: "Fish & Chips", price: 18, type: "seafood" }] },
  { id: 7, name: "Royal Hotel", suburb: "Paddington", lat: -33.8824, lng: 151.2285, specials: [{ item: "Schnitty", price: 18, type: "schnitty" }, { item: "Parmi", price: 20, type: "parmi" }] },
  { id: 8, name: "Bat & Ball", suburb: "Redfern", lat: -33.8923, lng: 151.2165, specials: [{ item: "Steak", price: 20, type: "steak" }] },
  { id: 9, name: "Woollahra Hotel", suburb: "Woollahra", lat: -33.8883, lng: 151.2369, specials: [{ item: "Burgers", price: 20, type: "burger" }] },
  { id: 10, name: "The Carrington", suburb: "Surry Hills", lat: -33.8877, lng: 151.2152, specials: [{ item: "Pasta", price: 20, type: "pasta" }] },
  { id: 11, name: "Bellevue Hotel", suburb: "Paddington", lat: -33.8855, lng: 151.2353, specials: [{ item: "Burgers", price: 22, type: "burger" }] },
  { id: 12, name: "The London", suburb: "Paddington", lat: -33.8852, lng: 151.2300, specials: [{ item: "Steak", price: 22, type: "steak" }] },
  { id: 13, name: "Four in Hand", suburb: "Paddington", lat: -33.8838, lng: 151.2344, specials: [{ item: "Belgian Mussels", price: 22, type: "seafood" }] },
  { id: 14, name: "The Waratah", suburb: "Darlinghurst", lat: -33.8782, lng: 151.2213, specials: [{ item: "Steak", price: 28, type: "steak" }] },
  { id: 15, name: "The Clock", suburb: "Surry Hills", lat: -33.8863, lng: 151.2140, specials: [{ item: "Hawkes Jugs", price: 18, type: "other" }] },
  { id: 16, name: "Nelson Hotel", suburb: "Bondi Junction", lat: -33.8903, lng: 151.2433, specials: [{ item: "Curry", price: 25, type: "other" }] },
  { id: 18, name: "Beach Road Hotel", suburb: "Bondi Beach", lat: -33.8864, lng: 151.2727, specials: [{ item: "Schnitty", price: 20, type: "schnitty" }, { item: "Parmi", price: 25, type: "parmi" }] },
  { id: 19, name: "East Sydney Hotel", suburb: "Woolloomooloo", lat: -33.8725, lng: 151.2168, specials: [{ item: "Burger & Beer", price: 25, type: "burger" }] }
];

const ALL_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAYS_WITH_DATA = new Set(['Thu']);

const ALL_SUBURBS = [...new Set(VENUES.map(v => v.suburb))].sort();
const ALL_TYPES = [
  { key: 'steak', label: 'Steak' },
  { key: 'schnitty', label: 'Schnitty' },
  { key: 'parmi', label: 'Parmi' },
  { key: 'burger', label: 'Burger' },
  { key: 'pizza', label: 'Pizza' },
  { key: 'pasta', label: 'Pasta' },
  { key: 'seafood', label: 'Seafood' },
  { key: 'wings', label: 'Wings' },
  { key: 'other', label: 'Other' }
];

const TYPE_HEX = {
  'steak': '#ff4444',
  'schnitty': '#39ff14',
  'parmi': '#2de86a',
  'burger': '#ff6600',
  'pizza': '#ff2d95',
  'pasta': '#b829ff',
  'seafood': '#00f0ff',
  'wings': '#ffe600',
  'other': '#14ffb4'
};

// ============================================================
// STATE
// ============================================================
let activeDays = new Set(['Thu']);
let activeSuburbs = new Set(ALL_SUBURBS);
const ALL_TYPE_KEYS = ALL_TYPES.map(t => t.key);
let activeTypes = new Set(ALL_TYPE_KEYS);
let currentSort = 'price';

// ============================================================
// FILTERING & SORTING
// ============================================================
function filterVenues() {
  const hasData = [...activeDays].some(d => DAYS_WITH_DATA.has(d));
  if (activeDays.size === 0 || !hasData) return [];
  return VENUES.filter(v => {
    const suburbMatch = activeSuburbs.size === 0 || activeSuburbs.has(v.suburb);
    const typeMatch = activeTypes.size === 0 || v.specials.some(s => activeTypes.has(s.type));
    return suburbMatch && typeMatch;
  });
}

function sortVenues(venues) {
  const copy = [...venues];
  switch (currentSort) {
    case 'price':
      return copy.sort((a, b) => Math.min(...a.specials.map(s => s.price)) - Math.min(...b.specials.map(s => s.price)));
    case 'suburb':
      return copy.sort((a, b) => a.suburb.localeCompare(b.suburb) || a.name.localeCompare(b.name));
    case 'name':
      return copy.sort((a, b) => a.name.localeCompare(b.name));
    default:
      return copy;
  }
}

// ============================================================
// RENDERING
// ============================================================
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function mapsUrl(venue) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue.name + ' ' + venue.suburb + ' Sydney')}`;
}

function renderCard(venue, index) {
  const specials = venue.specials.map(s =>
    `<span class="card__special"><strong>$${s.price}</strong> ${escapeHtml(s.item)}</span>`
  ).join('');

  const dayLabel = activeDays.has('Thu') ? 'Thu' : [...activeDays][0] || '';

  return `<article class="card" data-suburb="${escapeHtml(venue.suburb)}" style="animation-delay:${Math.min(index * 30, 500)}ms" onclick="window.open('${mapsUrl(venue)}','_blank')">
  <div class="card__top-row">
    <span class="card__suburb-badge" data-suburb="${escapeHtml(venue.suburb)}">${escapeHtml(venue.suburb)}</span>
    <span class="card__day-badge" data-day="${escapeHtml(dayLabel)}">${escapeHtml(dayLabel).toUpperCase()}</span>
  </div>
  <div class="card__pub-name">${escapeHtml(venue.name)}</div>
  <div class="card__specials">${specials}</div>
</article>`;
}

function render() {
  const grid = document.getElementById('card-grid');

  const hasData = [...activeDays].some(d => DAYS_WITH_DATA.has(d));
  if (activeDays.size === 0) {
    grid.innerHTML = `<div class="coming-soon">
      <div class="coming-soon__badge">NO DAY SELECTED</div>
      <div class="coming-soon__text">Select a day to see specials.</div>
    </div>`;
    document.getElementById('count-shown').textContent = '0';
    document.getElementById('count-total').textContent = VENUES.length;
    if (currentView === 'map' && map) updateMapMarkers();
    return;
  }
  if (!hasData) {
    const dayNames = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
    const selected = [...activeDays].map(d => dayNames[d] || d).join(', ');
    grid.innerHTML = `<div class="coming-soon">
      <div class="coming-soon__badge">COMING SOON</div>
      <div class="coming-soon__text">We're scouting ${selected} specials. Check back soon.</div>
    </div>`;
    document.getElementById('count-shown').textContent = '0';
    document.getElementById('count-total').textContent = VENUES.length;
    if (currentView === 'map' && map) updateMapMarkers();
    return;
  }

  const filtered = sortVenues(filterVenues());

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="coming-soon">
      <div class="coming-soon__badge">COMING SOON</div>
      <div class="coming-soon__text">No venues match that combo yet. We're always adding more.</div>
    </div>`;
  } else {
    grid.innerHTML = filtered.map((v, i) => renderCard(v, i)).join('');
  }

  document.getElementById('count-shown').textContent = filtered.length;
  document.getElementById('count-total').textContent = VENUES.length;

  if (currentView === 'map' && map) updateMapMarkers();
}

// ============================================================
// FILTER UI
// ============================================================
// Toggle helper: highlights all btn if set is full, none btn if set is empty, neither if partial
function syncToggles(filterName, setSize, totalSize) {
  document.querySelectorAll(`.filter-toggle[data-filter="${filterName}"]`).forEach(t => {
    if (t.dataset.action === 'all') t.classList.toggle('active', setSize === totalSize);
    else t.classList.toggle('active', setSize === 0);
  });
}

function initDayFilter() {
  const el = document.getElementById('day-filters');

  function update() { syncToggles('day', activeDays.size, ALL_DAYS.length); }

  document.querySelector('.filter-toggle[data-filter="day"][data-action="all"]').addEventListener('click', () => {
    activeDays = new Set(ALL_DAYS);
    el.querySelectorAll('.filter-btn').forEach(b => b.classList.add('active'));
    update(); render();
  });
  document.querySelector('.filter-toggle[data-filter="day"][data-action="none"]').addEventListener('click', () => {
    activeDays.clear();
    el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    update(); render();
  });

  ALL_DAYS.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeDays.has(day) ? ' active' : '');
    btn.textContent = day;
    btn.setAttribute('data-day', day);
    btn.addEventListener('click', () => {
      if (activeDays.size === ALL_DAYS.length) {
        activeDays = new Set([day]);
        el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      } else if (activeDays.has(day)) { activeDays.delete(day); btn.classList.remove('active'); }
      else { activeDays.add(day); btn.classList.add('active'); }
      update(); render();
    });
    el.appendChild(btn);
  });
}

function initSuburbFilter() {
  const el = document.getElementById('suburb-filters');

  function update() { syncToggles('suburb', activeSuburbs.size, ALL_SUBURBS.length); }

  document.querySelector('.filter-toggle[data-filter="suburb"][data-action="all"]').addEventListener('click', () => {
    activeSuburbs = new Set(ALL_SUBURBS);
    el.querySelectorAll('.filter-btn').forEach(b => b.classList.add('active'));
    update(); render();
  });
  document.querySelector('.filter-toggle[data-filter="suburb"][data-action="none"]').addEventListener('click', () => {
    activeSuburbs.clear();
    el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    update(); render();
  });

  ALL_SUBURBS.forEach(suburb => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.textContent = suburb;
    btn.setAttribute('data-suburb', suburb);
    btn.addEventListener('click', () => {
      if (activeSuburbs.size === ALL_SUBURBS.length) {
        activeSuburbs = new Set([suburb]);
        el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      } else if (activeSuburbs.has(suburb)) { activeSuburbs.delete(suburb); btn.classList.remove('active'); }
      else { activeSuburbs.add(suburb); btn.classList.add('active'); }
      update(); render();
    });
    el.appendChild(btn);
  });
}

// MAP
// ============================================================
let map = null;
let mapMarkers = [];
let currentView = 'grid';
let selectedMapVenue = null;

function createMarkerIcon(venue, isSelected) {
  const cheapest = venue.specials.reduce((a, b) => a.price <= b.price ? a : b);
  const color = TYPE_HEX[cheapest.type] || '#888899';
  const minPrice = cheapest.price;
  const bg = isSelected ? '#fff' : color;
  const fg = isSelected ? color : '#000';
  const shadow = isSelected
    ? `0 2px 10px rgba(0,0,0,0.5), 0 0 0 2px ${color}`
    : '0 2px 8px rgba(0,0,0,0.35)';
  const scale = isSelected ? 'transform:scale(1.1);' : '';
  return L.divIcon({
    className: 'custom-marker',
    html: `<div class="marker-pill" style="
      background:${bg}; color:${fg};
      min-width:42px; height:26px; padding:0 10px; border-radius:3px;
      font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px;
      box-shadow:${shadow};
      border:1.5px solid rgba(255,255,255,0.6);
      white-space:nowrap; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      ${scale}
    ">$${minPrice}</div>`,
    iconSize: [42, 26],
    iconAnchor: [21, 13],
    popupAnchor: [0, 0]
  });
}

function showMapCard(venue) {
  hideMapCard();
  selectedMapVenue = venue;
  const container = document.getElementById('pub-map');
  const point = map.latLngToContainerPoint([venue.lat, venue.lng]);
  const specials = venue.specials.map(s =>
    `<span class="map-card__special"><strong>$${s.price}</strong> ${escapeHtml(s.item)}</span>`
  ).join('');
  const card = document.createElement('div');
  card.className = 'map-card';
  card.id = 'map-card';
  card.innerHTML = `
    <div class="map-card__header">
      <div>
        <div class="map-card__name">${escapeHtml(venue.name)}</div>
        <div class="map-card__suburb">${escapeHtml(venue.suburb)}</div>
      </div>
      <button class="map-card__close" onclick="hideMapCard()">&#10005;</button>
    </div>
    <div class="map-card__specials">${specials}</div>
    <a class="map-card__directions" href="${mapsUrl(venue)}" target="_blank" rel="noopener">Get Directions</a>
  `;
  // Position below the marker, centered horizontally
  const cardWidth = 280;
  let left = point.x - cardWidth / 2;
  let top = point.y + 20;
  // Clamp to stay within map bounds
  const mapRect = container.getBoundingClientRect();
  left = Math.max(8, Math.min(left, mapRect.width - cardWidth - 8));
  top = Math.min(top, mapRect.height - 180);
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  container.appendChild(card);
  updateMapMarkers();
}

function hideMapCard() {
  selectedMapVenue = null;
  const existing = document.getElementById('map-card');
  if (existing) existing.remove();
  updateMapMarkers();
}

function getTileUrl() {
  const theme = document.documentElement.getAttribute('data-theme');
  return theme === 'light'
    ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
}

function initMap() {
  if (map) return;
  map = L.map('pub-map', { zoomControl: true, attributionControl: false }).setView([-33.884, 151.226], 14);
  L.tileLayer(getTileUrl(), { subdomains: 'abcd', maxZoom: 19 }).addTo(map);
  map.on('click', () => hideMapCard());
}

function updateMapMarkers() {
  if (!map) return;
  mapMarkers.forEach(m => map.removeLayer(m));
  mapMarkers = [];

  const filtered = filterVenues();

  filtered.forEach(venue => {
    const isSelected = selectedMapVenue && selectedMapVenue.id === venue.id;
    const marker = L.marker([venue.lat, venue.lng], { icon: createMarkerIcon(venue, isSelected) });
    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      if (selectedMapVenue && selectedMapVenue.id === venue.id) {
        hideMapCard();
      } else {
        showMapCard(venue);
      }
    });
    marker.addTo(map);
    mapMarkers.push(marker);
  });

  if (filtered.length > 0 && !selectedMapVenue) {
    map.fitBounds(L.featureGroup(mapMarkers).getBounds().pad(0.15));
  }
}

function setView(view) {
  currentView = view;
  const gridEl = document.querySelector('.grid-container');
  const mapEl = document.getElementById('map-container');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'map') {
    gridEl.style.display = 'none';
    mapEl.classList.add('visible');
    initMap();
    setTimeout(() => { map.invalidateSize(); updateMapMarkers(); }, 50);
  } else {
    gridEl.style.display = '';
    mapEl.classList.remove('visible');
  }
}

// ============================================================
// PICK FOR ME: Roulette wheel
// ============================================================
document.getElementById('pick-btn').addEventListener('click', function() {
  const filtered = filterVenues();
  const sorted = sortVenues(filtered);
  const pubData = sorted.map(v => ({ name: v.name, suburb: v.suburb, specials: v.specials }));
  const segments = pubData.length;
  if (segments === 0) return;
  const segAngle = (2 * Math.PI) / segments;

  const palette = ['#39ff14','#ff2d95','#00f0ff','#ffe600','#ff6600','#b829ff','#ff4444','#14ffb4'];

  // Build overlay
  const overlay = document.createElement('div');
  overlay.className = 'ee-roulette-overlay';
  const box = document.createElement('div');
  box.className = 'ee-roulette-box';
  const canvas = document.createElement('canvas');
  canvas.className = 'ee-roulette-canvas';
  canvas.width = 1120;
  canvas.height = 1120;
  const pointer = document.createElement('div');
  pointer.className = 'ee-roulette-pointer';
  box.appendChild(pointer);
  box.appendChild(canvas);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  const ctx = canvas.getContext('2d');
  const cx = 560, cy = 560, r = 520;

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, 1120, 1120);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    for (let i = 0; i < segments; i++) {
      const start = i * segAngle;
      const end = start + segAngle;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, start, end);
      ctx.closePath();
      ctx.fillStyle = palette[i % palette.length];
      ctx.globalAlpha = 0.3;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = palette[i % palette.length];
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.save();
      ctx.rotate(start + segAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.min(26, 480 / segments)}px 'IBM Plex Mono', monospace`;
      const name = pubData[i].name.length > 18 ? pubData[i].name.slice(0, 17) + '..' : pubData[i].name;
      ctx.fillText(name, r - 20, 6);
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, 2 * Math.PI);
    ctx.fillStyle = '#0a0a16';
    ctx.fill();
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  const winIndex = Math.floor(Math.random() * segments);
  const targetAngle = -Math.PI / 2 - (winIndex * segAngle + segAngle / 2);
  const totalSpin = targetAngle - 10 * Math.PI;
  const spinDuration = 5000;
  const startTime = performance.now();

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / spinDuration, 1);
    const eased = easeOutQuart(t);
    drawWheel(totalSpin * eased);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      setTimeout(() => {
        overlay.remove();
        showWinnerScreen(pubData[winIndex]);
      }, 600);
    }
  }

  drawWheel(0);
  requestAnimationFrame(animate);

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
});

function showWinnerScreen(venue) {
  const screen = document.createElement('div');
  screen.className = 'ee-winner-screen';

  const confettiColors = ['#39ff14','#ff2d95','#00f0ff','#ffe600','#ff6600','#b829ff','#ff4444','#14ffb4'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'ee-winner-confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    c.style.animationDelay = (Math.random() * 0.8) + 's';
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = c.style.width;
    screen.appendChild(c);
  }

  const crown = document.createElement('div');
  crown.className = 'ee-winner-crown';
  crown.textContent = '\uD83C\uDFC6';
  screen.appendChild(crown);

  const label = document.createElement('div');
  label.className = 'ee-winner-label';
  label.textContent = 'TONIGHT YOU\'RE GOING TO';
  screen.appendChild(label);

  const name = document.createElement('div');
  name.className = 'ee-winner-name';
  name.textContent = venue.name;
  screen.appendChild(name);

  const suburb = document.createElement('div');
  suburb.className = 'ee-winner-suburb';
  suburb.textContent = venue.suburb;
  screen.appendChild(suburb);

  const specials = document.createElement('div');
  specials.className = 'ee-winner-specials';
  venue.specials.forEach(s => {
    const tag = document.createElement('div');
    tag.className = 'ee-winner-special';
    tag.textContent = '$' + s.price + ' ' + s.item;
    specials.appendChild(tag);
  });
  screen.appendChild(specials);

  const dismiss = document.createElement('div');
  dismiss.className = 'ee-winner-dismiss';
  dismiss.textContent = 'tap anywhere to close';
  screen.appendChild(dismiss);

  document.body.appendChild(screen);

  screen.addEventListener('click', () => {
    screen.style.opacity = '0';
    screen.style.transition = 'opacity 0.3s';
    setTimeout(() => screen.remove(), 300);
  });
}
